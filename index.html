<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#174a3a">
<meta name="description" content="JLPT N4 Japanese kanji vocabulary flashcards for Nepali learners. Works offline after the first load.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>JLPT N4 Kanji Cards - Nepal</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2b25;background:#f3f6f3}
*{box-sizing:border-box}body{margin:0;min-height:100vh}
header{background:#174a3a;color:white;padding:18px 16px;text-align:center}
header h1{font-size:1.15rem;margin:0 0 4px}header p{font-size:.85rem;margin:0;opacity:.88}
main{max-width:620px;margin:0 auto;padding:18px 16px 36px}
.status{display:flex;justify-content:space-between;gap:10px;color:#52645b;font-size:.85rem;margin-bottom:12px}
.progress{height:7px;background:#dce5df;border-radius:20px;overflow:hidden;margin-bottom:18px}
#bar{height:100%;width:0;background:#26835d;transition:width .2s}
.card{width:100%;min-height:300px;border:1px solid #d8e2db;border-radius:22px;background:white;box-shadow:0 8px 24px #183d2a12;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.card:focus{outline:3px solid #8abca4;outline-offset:3px}
.hint{font-size:.85rem;color:#74837b;margin-bottom:22px}
.frontword{font-size:clamp(3.2rem,14vw,5.2rem);font-weight:700;line-height:1.25;word-break:keep-all}
.back{width:100%;display:none;text-align:left}
.back h2{text-align:center;font-size:2rem;margin:0 0 6px}
.reading{text-align:center;font-size:1.25rem;color:#476454;margin-bottom:22px}
.meaning{border-top:1px solid #e4ebe6;padding:14px 4px}
.meaning b{display:block;font-size:.78rem;color:#64756b;margin-bottom:5px}
.meaning span{font-size:1.12rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
button{border:0;border-radius:12px;padding:13px 12px;font-size:1rem;font-weight:650;cursor:pointer}
button:focus{outline:3px solid #8abca4;outline-offset:2px}
.primary{background:#174a3a;color:white}.secondary{background:#e3eee7;color:#174a3a}
.know{background:#d9efe1;color:#175b37}.unknown{background:#fff0d9;color:#80500b}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.toolbar button{flex:1;min-width:100px;font-size:.88rem;padding:11px 8px}
.note{font-size:.82rem;color:#64756b;line-height:1.55;margin-top:18px}
#message{min-height:1.4em;color:#286247;font-size:.85rem;text-align:center;margin-top:8px}
.hidden{display:none!important}
@media(min-width:520px){main{padding-top:26px}.card{min-height:340px}}
</style>
</head>
<body>
<header><h1>JLPT N4 漢字カード</h1><p>ネパール語版 · English + नेपाली</p></header>
<main>
  <div class="status"><span id="counter">1 / 300</span><span id="knownCount">覚えた：0語</span></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="card" id="card" role="button" tabindex="0" aria-label="カードを裏返す">
    <div class="hint" id="hint">タップすると読み方と意味が見られます</div>
    <div class="frontword" id="frontWord">家</div>
    <div class="back" id="back">
      <h2 id="backWord">家</h2>
      <div class="reading" id="reading">いえ</div>
      <div class="meaning"><b>ENGLISH</b><span id="english">house / home</span></div>
      <div class="meaning"><b>नेपाली</b><span id="nepali">घर</span></div>
    </div>
  </div>
  <div class="actions">
    <button class="secondary" id="prev">← 前へ</button>
    <button class="primary" id="next">次へ →</button>
    <button class="know" id="known">覚えた ✓</button>
    <button class="unknown" id="notKnown">まだ覚えていない</button>
  </div>
  <div class="toolbar">
    <button class="secondary" id="shuffle">ランダム</button>
    <button class="secondary" id="review">未習得を復習</button>
    <button class="secondary" id="all">全300語</button>
  </div>
  <div id="message" aria-live="polite"></div>
  <p class="note">使い方：カードをタップして裏返します。「覚えた」「まだ覚えていない」で学習状況を記録できます。記録はこの端末に保存されます。最初にオンラインで開いて読み込みが完了すれば、次回からオフラインでも使えます。</p>
</main>
<script src="app.js"></script>
</body>
</html>
